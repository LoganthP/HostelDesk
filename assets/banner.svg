<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="HostelDesk banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0e7490"/>
      <animate attributeName="x2" values="1;0.7;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
      <animate attributeName="x1" values="-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- floating orbs -->
    <circle cx="140" cy="70" r="90" fill="#6366f1" opacity="0.18">
      <animate attributeName="cy" values="70;110;70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="250" r="120" fill="#06b6d4" opacity="0.16">
      <animate attributeName="cy" values="250;200;250" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="20" r="60" fill="#f472b6" opacity="0.12">
      <animate attributeName="cx" values="640;720;640" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- building icon -->
    <g transform="translate(110,95)" filter="url(#glow)">
      <rect x="0" y="30" width="90" height="100" rx="8" fill="#ffffff" opacity="0.95"/>
      <rect x="20" y="0" width="50" height="40" rx="6" fill="#c7d2fe"/>
      <g fill="#4f46e5">
        <rect x="12" y="46" width="16" height="16" rx="3"/>
        <rect x="37" y="46" width="16" height="16" rx="3"/>
        <rect x="62" y="46" width="16" height="16" rx="3"/>
        <rect x="12" y="72" width="16" height="16" rx="3"/>
        <rect x="37" y="72" width="16" height="16" rx="3">
          <animate attributeName="fill" values="#4f46e5;#fbbf24;#4f46e5" dur="3s" repeatCount="indefinite"/>
        </rect>
        <rect x="62" y="72" width="16" height="16" rx="3"/>
      </g>
      <rect x="34" y="100" width="22" height="30" rx="4" fill="#0e7490"/>
    </g>

    <!-- title -->
    <text x="250" y="165" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="url(#title)" filter="url(#glow)">HostelDesk</text>
    <text x="254" y="212" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#e0e7ff" opacity="0.95">Hostel Complaint Management System</text>
    <text x="254" y="252" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#a5f3fc">
      Report  ·  Assign  ·  Resolve  ·  Track
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </text>

    <!-- bottom wave -->
    <path d="M0 295 Q150 270 300 295 T600 295 T900 295 T1200 295 V320 H0 Z" fill="#ffffff" opacity="0.08">
      <animateTransform attributeName="transform" type="translate" values="0 0;-300 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0 305 Q150 285 300 305 T600 305 T900 305 T1200 305 T1500 305 V320 H0 Z" fill="#ffffff" opacity="0.06">
      <animateTransform attributeName="transform" type="translate" values="-300 0;0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
